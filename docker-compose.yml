version: '3'

services:
  # App container for development
  ws:
    image: bcu/lrs_ws
    build:
      context: .
      args:
        USER_NAME: ${USER_NAME}
        USER_PASSWD: ${USER_PASSWD}
        USER_UID: ${USER_UID}
        USER_GID: ${USER_UID}
    volumes:
      - .:/home/${USER_NAME}/lrs/app
      - ./service/data:/home/${USER_NAME}/lrs/data
    user: ${USER_NAME}
    entrypoint: python manage.py runserver 0.0.0.0:8000
    # command: uwsgi --http :8000 --module localResWS.wsgi --master --workers 6 --processes 8 --threads 8

# NGINX proxy
  proxy:
    image: bcu/nginx:1.17-alpine
    build: nginx
    restart: always
    ports:
      - "${APP_EXT_PORT}:8000"
    volumes:
      - ./nginx/:/etc/nginx/conf.d/:ro
      - ./static:/static
    depends_on:
      - ws