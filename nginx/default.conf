server {
    listen 8003;
    server_name lrs-dev.local;
    charset utf-8;

    location / {
        proxy_pass http://lrs-dev:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        autoindex on;
        alias /static/;
    }
}